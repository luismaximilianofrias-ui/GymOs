<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>GymOS — Control de Miembros</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:hidden;overscroll-behavior-x:none}
:root{
  --bg:#0D0D1A;--surface:#151526;--card:#1C1C35;--border:rgba(255,255,255,.07);
  --violet:#7C3AED;--vlight:#A78BFA;--green:#10B981;--amber:#F59E0B;--red:#EF4444;
  --blue:#3B82F6;--pink:#EC4899;
  --text:#F8FAFC;--muted:#94A3B8;--subtle:#334155;
  --nav-h:62px;
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;overscroll-behavior-x:none;width:100%;position:relative}

/* ═══════════════ TOP NAV ═══════════════ */
#topNav{
  position:fixed;top:0;left:0;right:0;height:var(--nav-h);
  background:rgba(13,13,26,.88);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 28px;z-index:200;
  transition:box-shadow .3s;
}
#topNav.scrolled{box-shadow:0 4px 32px rgba(0,0,0,.5)}
.nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.nav-logo-icon{width:34px;height:34px;background:linear-gradient(135deg,var(--violet),#A855F7);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px}
.nav-logo-text{font-size:18px;font-weight:800;letter-spacing:-.5px;color:var(--text)}
.nav-logo-text span{color:var(--vlight)}
.nav-links{display:flex;align-items:center;gap:4px}
.nav-link{
  padding:7px 14px;border-radius:9px;font-size:13px;font-weight:500;
  color:var(--muted);cursor:pointer;border:none;background:none;font-family:inherit;
  transition:all .15s;position:relative;
}
.nav-link:hover{color:var(--text);background:rgba(255,255,255,.05)}
.nav-link.active{color:var(--vlight);background:rgba(124,58,237,.15)}
.nav-link .nb{
  position:absolute;top:4px;right:6px;
  background:var(--red);color:#fff;font-size:9px;font-weight:700;
  padding:1px 5px;border-radius:20px;
}
.nav-right{display:flex;align-items:center;gap:10px}
.nav-user{display:flex;align-items:center;gap:8px;cursor:pointer;padding:5px 10px;border-radius:10px;transition:background .15s}
.nav-user:hover{background:rgba(255,255,255,.06)}
.nav-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
.nav-name{font-size:13px;font-weight:600}
.nav-role{font-size:10px;color:var(--muted)}
.btn-logout{padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600;border:1px solid var(--border);background:none;color:var(--muted);cursor:pointer;font-family:inherit;transition:all .15s}
.btn-logout:hover{color:var(--red);border-color:rgba(239,68,68,.4)}

/* ═══════════════ LAYOUT ═══════════════ */
#appWrap{display:flex;min-height:100vh;padding-top:var(--nav-h);overflow-x:hidden;width:100%}
#sidebar{
  width:220px;position:fixed;top:var(--nav-h);bottom:0;left:0;
  background:var(--surface);border-right:1px solid var(--border);
  padding:16px 12px;overflow-y:auto;z-index:100;
  display:flex;flex-direction:column;
}
.sid-label{font-size:10px;font-weight:600;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;padding:8px 12px 5px}
.sid-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 12px;border-radius:9px;cursor:pointer;
  color:var(--muted);font-size:13px;font-weight:500;
  transition:all .15s;margin-bottom:2px;
}
.sid-item:hover{background:rgba(124,58,237,.1);color:var(--vlight)}
.sid-item.active{background:rgba(124,58,237,.18);color:var(--vlight);font-weight:600}
.sid-icon{font-size:15px;width:18px;text-align:center}
.sid-badge{margin-left:auto;background:var(--red);color:#fff;font-size:9px;font-weight:700;padding:2px 6px;border-radius:20px}
.sid-footer{margin-top:auto;padding-top:12px;border-top:1px solid var(--border)}

#mainContent{margin-left:220px;padding:28px 32px;flex:1;min-height:calc(100vh - var(--nav-h));overflow-x:hidden;min-width:0}

/* ═══════════════ PAGE SECTIONS ═══════════════ */
.page-sec{display:none}.page-sec.active{display:block;overflow-x:hidden;max-width:100%}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:12px}
.page-title{font-size:24px;font-weight:800;letter-spacing:-.5px}
.page-sub{font-size:13px;color:var(--muted);margin-top:2px}

/* ═══════════════ BUTTONS ═══════════════ */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:10px;font-size:13px;font-weight:600;border:none;cursor:pointer;font-family:inherit;transition:all .18s}
.btn-primary{background:var(--violet);color:#fff}
.btn-primary:hover{background:#6D28D9;transform:translateY(-1px);box-shadow:0 8px 24px rgba(124,58,237,.35)}
.btn-ghost{background:var(--surface);color:var(--text);border:1px solid var(--border)}
.btn-ghost:hover{border-color:var(--vlight);color:var(--vlight)}
.btn-danger{background:rgba(239,68,68,.12);color:var(--red);border:1px solid rgba(239,68,68,.25)}
.btn-danger:hover{background:rgba(239,68,68,.22)}
.btn-success{background:rgba(16,185,129,.12);color:var(--green);border:1px solid rgba(16,185,129,.25)}
.btn-success:hover{background:rgba(16,185,129,.22)}
.btn-amber{background:rgba(245,158,11,.12);color:var(--amber);border:1px solid rgba(245,158,11,.25)}
.btn-amber:hover{background:rgba(245,158,11,.22)}
.btn-sm{padding:5px 11px;font-size:11px}
.btn-xs{padding:3px 9px;font-size:11px;border-radius:7px}

/* ═══════════════ STATS ═══════════════ */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s;cursor:default}
.stat-card:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(0,0,0,.3)}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.stat-card.c-violet::before{background:linear-gradient(90deg,var(--violet),#A855F7)}
.stat-card.c-green::before{background:linear-gradient(90deg,var(--green),#34D399)}
.stat-card.c-amber::before{background:linear-gradient(90deg,var(--amber),#FCD34D)}
.stat-card.c-red::before{background:linear-gradient(90deg,var(--red),#F87171)}
.stat-icon{position:absolute;right:18px;top:20px;font-size:26px;opacity:.12}
.stat-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
.stat-value{font-size:34px;font-weight:800;letter-spacing:-1px;line-height:1}
.stat-sub{font-size:11px;color:var(--muted);margin-top:5px}

/* ═══════════════ TABLE ═══════════════ */
.table-wrap{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;max-width:100%}
table{width:100%;border-collapse:collapse}
thead th{padding:12px 18px;text-align:left;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;background:rgba(255,255,255,.02);border-bottom:1px solid var(--border)}
tbody tr{border-bottom:1px solid var(--border);transition:background .12s;cursor:pointer}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:rgba(124,58,237,.06)}
td{padding:13px 18px;font-size:13px;vertical-align:middle}
.member-info{display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;background-size:cover;background-position:center}
.member-name{font-weight:600;font-size:13px}
.member-email{font-size:11px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}
.badge::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}
.b-active{background:rgba(16,185,129,.12);color:var(--green)}
.b-expiring{background:rgba(245,158,11,.12);color:var(--amber)}
.b-expired{background:rgba(239,68,68,.12);color:var(--red)}
.b-paused{background:rgba(148,163,184,.1);color:var(--muted)}
.plan-tag{font-size:11px;font-weight:500;padding:3px 8px;border-radius:6px;background:rgba(124,58,237,.12);color:var(--vlight);border:1px solid rgba(124,58,237,.2)}
.days-bar{display:flex;align-items:center;gap:8px}
.days-track{flex:1;height:5px;background:var(--subtle);border-radius:3px;overflow:hidden;min-width:60px}
.days-fill{height:100%;border-radius:3px}
.days-text{font-size:11px;color:var(--muted);white-space:nowrap;min-width:48px}
.row-actions{display:flex;gap:5px;justify-content:flex-end}

/* ═══════════════ SEARCH/FILTERS ═══════════════ */
.search-box{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 12px;min-width:220px;transition:border-color .2s}
.search-box:focus-within{border-color:var(--violet)}
.search-box input{background:none;border:none;outline:none;color:var(--text);font-size:13px;width:100%;font-family:inherit}
.search-box input::placeholder{color:var(--muted)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.flt{padding:5px 12px;border-radius:8px;font-size:12px;font-weight:600;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;font-family:inherit;transition:all .15s}
.flt.active,.flt:hover{background:rgba(124,58,237,.14);border-color:var(--violet);color:var(--vlight)}
.sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.sec-title{font-size:16px;font-weight:700}

/* ═══════════════ MODAL ═══════════════ */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(7px);z-index:500;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-ov.open{opacity:1;pointer-events:all}
.modal{background:var(--card);border:1px solid var(--border);border-radius:20px;width:100%;max-width:540px;padding:30px;transform:translateY(14px) scale(.97);transition:transform .25s;max-height:90vh;overflow-y:auto}
.modal-ov.open .modal{transform:none}
.modal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.modal-title{font-size:18px;font-weight:700}
.modal-close{width:30px;height:30px;border-radius:7px;background:var(--surface);border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;transition:all .15s}
.modal-close:hover{color:var(--text);border-color:var(--vlight)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fg{margin-bottom:14px}.fg.full{grid-column:1/-1}
.fl{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;display:block}
.fi,.fs{width:100%;padding:9px 13px;background:var(--surface);border:1px solid var(--border);border-radius:9px;color:var(--text);font-size:13px;font-family:inherit;outline:none;transition:border-color .2s}
.fi:focus,.fs:focus{border-color:var(--violet)}
.fs option{background:var(--surface)}
textarea.fi{resize:vertical;min-height:80px}
.modal-ft{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;border-top:1px solid var(--border);padding-top:18px}

/* ═══════════════ PROFILE VIEW ═══════════════ */
.profile-hd{display:flex;align-items:center;gap:18px;background:var(--surface);border-radius:14px;padding:18px;margin-bottom:20px;border:1px solid var(--border)}
.profile-av{width:68px;height:68px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:26px;flex-shrink:0;background-size:cover;background-position:center;position:relative}
.profile-name{font-size:20px;font-weight:800}
.profile-plan{font-size:12px;color:var(--muted);margin-top:2px}
.ring-wrap{text-align:center}
svg.ring{transform:rotate(-90deg)}
.ring-track{fill:none;stroke:var(--subtle);stroke-width:8}
.ring-fill{fill:none;stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.4,0,.2,1)}
.ring-center{position:relative;display:inline-flex;align-items:center;justify-content:center}
.ring-num{position:absolute;font-size:20px;font-weight:800;line-height:1;text-align:center}
.ring-lbl{font-size:10px;color:var(--muted);margin-top:6px;font-weight:500;text-transform:uppercase;letter-spacing:.5px}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.info-item{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:13px}
.info-item .lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;font-weight:600}
.info-item .val{font-size:14px;font-weight:700}

/* ═══════════════ RENEW MODAL (months grid) ═══════════════ */
.months-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.month-btn{
  padding:10px 6px;border-radius:10px;border:1px solid var(--border);
  background:var(--surface);color:var(--muted);cursor:pointer;
  text-align:center;font-family:inherit;transition:all .15s;
}
.month-btn:hover{border-color:var(--violet);color:var(--vlight)}
.month-btn.sel{background:rgba(124,58,237,.2);border-color:var(--violet);color:var(--vlight);font-weight:700}
.month-btn .mnum{font-size:18px;font-weight:800;display:block;line-height:1}
.month-btn .mlab{font-size:10px;margin-top:3px;display:block}

/* ═══════════════ NEWS ═══════════════ */
.news-grid{display:flex;flex-direction:column;gap:14px}
.news-card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;transition:transform .15s,box-shadow .15s}
.news-card:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(0,0,0,.3)}
.news-img{width:100%;height:180px;object-fit:cover;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:48px;color:var(--muted)}
.news-body{padding:20px}
.news-cat{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}
.news-title{font-size:17px;font-weight:700;margin-bottom:8px;line-height:1.3}
.news-text{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:14px}
.news-meta{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.news-date{font-size:11px;color:var(--muted)}
.reactions{display:flex;gap:6px}
.react-btn{
  display:flex;align-items:center;gap:4px;
  padding:5px 10px;border-radius:20px;font-size:12px;font-weight:600;
  border:1px solid var(--border);background:var(--surface);
  cursor:pointer;font-family:inherit;transition:all .15s;
  color:var(--muted);
}
.react-btn:hover{border-color:var(--vlight);color:var(--vlight)}
.react-btn.reacted{background:rgba(124,58,237,.15);border-color:var(--violet);color:var(--vlight)}
.react-count{font-size:12px}
/* admin news form */
.news-form-card{background:var(--card);border:1px dashed rgba(124,58,237,.4);border-radius:16px;padding:22px;margin-bottom:18px}

/* ═══════════════ SUGGESTIONS ═══════════════ */
.sug-list{display:flex;flex-direction:column;gap:10px}
.sug-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 20px;display:flex;align-items:flex-start;gap:14px;transition:transform .12s}
.sug-card:hover{transform:translateX(3px)}
.sug-icon{font-size:20px;flex-shrink:0;margin-top:2px}
.sug-body{flex:1}
.sug-head{display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap}
.sug-from{font-weight:600;font-size:13px}
.sug-type{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;padding:2px 7px;border-radius:5px}
.t-sug{background:rgba(124,58,237,.12);color:var(--vlight)}
.t-rep{background:rgba(239,68,68,.1);color:var(--red)}
.t-com{background:rgba(16,185,129,.1);color:var(--green)}
.sug-text{font-size:13px;color:var(--muted);line-height:1.5}
.sug-date{font-size:11px;color:var(--subtle);margin-top:5px}
.sug-status{flex-shrink:0;margin-top:2px}
.stt{font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px}
.stt-pend{background:rgba(245,158,11,.1);color:var(--amber)}
.stt-done{background:rgba(16,185,129,.1);color:var(--green)}
.stt-rev{background:rgba(124,58,237,.1);color:var(--vlight)}

/* ═══════════════ USER PROFILE PAGE ═══════════════ */
.user-profile-wrap{max-width:680px;margin:0 auto}
.user-profile-hero{
  background:linear-gradient(135deg,rgba(124,58,237,.25),rgba(16,185,129,.15));
  border:1px solid var(--border);border-radius:20px;
  padding:32px;margin-bottom:22px;
  display:flex;align-items:center;gap:24px;
}
.up-avatar-wrap{position:relative;flex-shrink:0}
.up-avatar{width:90px;height:90px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:34px;border:3px solid var(--violet);background-size:cover;background-position:center}
.up-avatar-btn{
  position:absolute;bottom:0;right:0;
  width:26px;height:26px;border-radius:50%;
  background:var(--violet);border:2px solid var(--bg);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:13px;
}
.up-name{font-size:24px;font-weight:800;letter-spacing:-.5px}
.up-plan{font-size:13px;color:var(--muted);margin-top:2px}
.up-meta{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap}
.up-meta-item{font-size:12px;color:var(--muted)}
.up-meta-item strong{color:var(--text);font-weight:600}
.up-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px;margin-bottom:16px}
.up-card-title{font-size:14px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.days-ring-row{display:flex;justify-content:center;padding:10px 0}

/* ═══════════════ ALERTS ═══════════════ */
.alert-card{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:15px 20px;display:flex;align-items:center;gap:14px;margin-bottom:8px;transition:transform .12s}
.alert-card:hover{transform:translateX(3px)}
.alert-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.alert-body{flex:1}
.alert-name{font-weight:600;font-size:13px}
.alert-msg{font-size:12px;color:var(--muted);margin-top:1px}

/* ═══════════════ SETTINGS ═══════════════ */
.set-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px;margin-bottom:16px}
.set-title{font-size:15px;font-weight:700;margin-bottom:18px}
.set-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border)}
.set-row:last-child{border-bottom:none}
.set-lbl{font-size:13px;font-weight:500}
.set-desc{font-size:11px;color:var(--muted);margin-top:2px}
.toggle{width:42px;height:22px;background:var(--subtle);border-radius:11px;position:relative;cursor:pointer;transition:background .2s;border:none;flex-shrink:0}
.toggle.on{background:var(--violet)}
.toggle::after{content:'';position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:3px;left:3px;transition:left .18s}
.toggle.on::after{left:23px}

/* ═══════════════ TOAST ═══════════════ */
#toastWrap{position:fixed;bottom:24px;right:24px;z-index:999;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:12px 18px;display:flex;align-items:center;gap:9px;font-size:13px;font-weight:500;box-shadow:0 14px 36px rgba(0,0,0,.4);animation:toastIn .3s ease;min-width:220px}
@keyframes toastIn{from{transform:translateX(50px);opacity:0}}

/* ═══════════════ BACK TO TOP ═══════════════ */
#backTop{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--violet);color:#fff;border:none;cursor:pointer;
  width:42px;height:42px;border-radius:50%;font-size:18px;
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:all .3s;z-index:150;
  box-shadow:0 6px 20px rgba(124,58,237,.45);
}

/* ═══════════════ LOGIN ═══════════════ */
#loginScreen{
  position:fixed;inset:0;background:var(--bg);z-index:900;
  display:flex;align-items:center;justify-content:center;
  padding:20px;
}
.login-box{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:40px;width:100%;max-width:420px;text-align:center}
.login-logo{margin-bottom:28px}
.login-logo .ico{width:56px;height:56px;background:linear-gradient(135deg,var(--violet),#A855F7);border-radius:16px;display:inline-flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:12px}
.login-logo h1{font-size:26px;font-weight:800;letter-spacing:-.5px}
.login-logo h1 span{color:var(--vlight)}
.login-sub{font-size:14px;color:var(--muted);margin-bottom:28px}
.login-tabs{display:flex;background:var(--surface);border-radius:11px;padding:4px;margin-bottom:24px;border:1px solid var(--border)}
.login-tab{flex:1;padding:8px;border-radius:8px;border:none;background:none;font-family:inherit;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .15s}
.login-tab.active{background:var(--violet);color:#fff}
.fg-login{text-align:left;margin-bottom:14px}
.fl-login{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;display:block}
.fi-login{width:100%;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:border-color .2s}
.fi-login:focus{border-color:var(--violet)}
.login-hint{font-size:11px;color:var(--muted);margin-top:16px}

/* ═══════════════ MISC ═══════════════ */
.empty-state{text-align:center;padding:52px 20px;color:var(--muted)}
.empty-icon{font-size:44px;margin-bottom:10px;opacity:.35}
.sep{height:1px;background:var(--border);margin:20px 0}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--subtle);border-radius:3px}

/* ═══════════════ MEMBER CARDS (mobile) ═══════════════ */
.member-cards{display:none;flex-direction:column;gap:10px}
.mc{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;cursor:pointer;transition:transform .15s,box-shadow .15s}
.mc:active{transform:scale(.98)}
.mc:hover{box-shadow:0 6px 20px rgba(0,0,0,.25)}
.mc-top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.mc-info{flex:1;min-width:0}
.mc-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc-email{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc-mid{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.mc-bot{display:flex;gap:6px}

/* ═══════════════ HAMBURGER ═══════════════ */
#navHamburger{
  display:none;width:36px;height:36px;border-radius:9px;
  background:var(--surface);border:1px solid var(--border);
  align-items:center;justify-content:center;cursor:pointer;
  font-size:17px;color:var(--text);flex-shrink:0;
}

/* ═══════════════ BOTTOM NAV (mobile) ═══════════════ */
#bottomNav{
  display:none;
  position:fixed;bottom:0;left:0;right:0;

  border-top:1px solid var(--border);

}
.bnav-inner{display:flex;height:58px;align-items:stretch;padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav-item{

.bnav-item.active{color:var(--vlight)}
.bnav-icon{font-size:19px;line-height:1}
.bnav-dot{

}

/* ═══════════════ MOBILE DRAWER ═══════════════ */

.drawer-nav{padding:10px;flex:1;overflow-y:auto}
.drawer-footer{padding:12px;border-top:1px solid var(--border)}

}

const SUPA_URL = 'https://dkhlkdqyhkjykzwfyjgj.supabase.co';
const SUPA_KEY = 'sb_publishable_i_FVM973dSbz27ZWG9reAw_dYfizARU';
const SUPA_TABLE = 'gymos_data';
let SUPA_ROW_ID = null; // se carga al iniciar

async function supaFetch(method, body){
  const url = SUPA_ROW_ID
    ? `${SUPA_URL}/rest/v1/${SUPA_TABLE}?id=eq.${SUPA_ROW_ID}`
    : `${SUPA_URL}/rest/v1/${SUPA_TABLE}`;
  const res = await fetch(url, {
    method,
    headers:{
      'apikey': SUPA_KEY,
      'Authorization': 'Bearer ' + SUPA_KEY,
      'Content-Type': 'application/json',
      'Prefer': method==='POST' ? 'return=representation' : 'return=minimal'
    },
    body: body ? JSON.stringify(body) : undefined
  });
  if(!res.ok){
    const err = await res.text();
    throw new Error('Supabase error: ' + err);
  }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

async function cargarSupabase(){
  try{
    showToast('Conectando...','info');
    const rows = await supaFetch('GET');
    if(rows && rows.length > 0){
      SUPA_ROW_ID = rows[0].id;
      // Si la fila tiene datos reales, usarlos
      if(rows[0].data && Object.keys(rows[0].data).length > 0){
        DB = rows[0].data;
        localStorage.setItem('gymos_db', JSON.stringify(DB));
        console.log('Datos cargados desde Supabase');
      } else {
        // Fila vacía: subir los datos locales
        await supaFetch('PATCH', { data: DB });
        console.log('Datos iniciales subidos a Supabase');
      }
    } else {
      // No hay filas: crear una
      const created = await supaFetch('POST', { data: DB });
      if(created && created[0]) SUPA_ROW_ID = created[0].id;
      console.log('Fila creada en Supabase');
    }
    showToast('Conectado ✓','success');
  } catch(err){
    console.error('Error Supabase:', err);
    showToast('Sin conexión, usando datos locales','warning');
  }
}

async function saveDB(){
  localStorage.setItem('gymos_db', JSON.stringify(DB));
  try{
    if(SUPA_ROW_ID){
      await supaFetch('PATCH', { data: DB });
    }
  } catch(err){
    console.error('Error guardando en Supabase:', err);
    showToast('Error al guardar en la nube','error');
  }
}

const PLAN_DAYS={Mensual:30,Trimestral:90,Semestral:180,Anual:365};
function getStatus(m){
  if(m.status==='paused')return'paused';
  const rem=getRemaining(m);
  if(rem<=0)return'expired';
  if(rem<=7)return'expiring';
  return'active';
}
function getRemaining(m){
  const days=m.totalDays||PLAN_DAYS[m.plan]||30;
  const end=new Date(m.start+'T12:00:00');end.setDate(end.getDate()+days);
  return Math.max(0,Math.ceil((end-new Date())/86400000));
}
function getEndDate(m){
  const days=m.totalDays||PLAN_DAYS[m.plan]||30;
  const d=new Date(m.start+'T12:00:00');d.setDate(d.getDate()+days);
  return d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'});
}
const SL={active:'Activo',expiring:'Por vencer',expired:'Vencido',paused:'Pausado'};
const SC={active:'b-active',expiring:'b-expiring',expired:'b-expired',paused:'b-paused'};
const CCAT={Novedades:'#A78BFA',Eventos:'#F472B6',Horarios:'#34D399',Salud:'#60A5FA',Mantenimiento:'#FBB040'};

let currentUser=null;// {role:'admin'} or {role:'member', memberId}
let loginTab='admin';

function setLoginTab(t,btn){
  loginTab=t;
  document.querySelectorAll('.login-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('loginAdminFields').style.display=t==='admin'?'':'none';
  document.getElementById('loginUserFields').style.display=t==='user'?'':'none';
}

function doLogin(){
  if(loginTab==='admin'){
    const u=document.getElementById('loginUser').value.trim();
    const p=document.getElementById('loginPass').value;
    if(u==='admin'&&p==='1234'){
      currentUser={role:'admin'};
      bootApp();
    } else {showToast('Usuario o contraseña incorrectos','error')}
  } else {
    const e=document.getElementById('loginEmail').value.trim().toLowerCase();
    const p=document.getElementById('loginPassU').value;
    const m=DB.members.find(x=>x.email.toLowerCase()===e&&x.pass===p);
    if(m){currentUser={role:'member',memberId:m.id};bootApp();}
    else showToast('Email o contraseña incorrectos','error');
  }
}

function doLogout(){
  currentUser=null;
  toggleDrawer(false);
  document.body.style.overflow='';
  document.getElementById('loginScreen').style.display='flex';
  document.getElementById('topNav').style.display='none';
  document.getElementById('appWrap').style.display='none';
  document.getElementById('loginPass').value='';
  document.getElementById('loginPassU').value='';
}

function bootApp(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('topNav').style.display='flex';
  document.getElementById('appWrap').style.display='flex';
  buildNav();
  if(currentUser.role==='admin') navigate('dashboard');
  else navigate('myprofile');
  // Sincronizar con Supabase en segundo plano
  cargarSupabase();
}

function buildNav(){

  // ── desktop top nav links

  nl.innerHTML='';
  pages.forEach(p=>{
    const b=document.createElement('button');
    b.className='nav-link';b.dataset.page=p.id;
    b.innerHTML=`${p.icon} ${p.label}`;
    if(p.badge)b.innerHTML+=`<span class="nb" id="nb_${p.id}"></span>`;
    b.onclick=()=>navigate(p.id);
    nl.appendChild(b);
  });

  // ── desktop sidebar

  sb.innerHTML='<div class="sid-label">Menú</div>';
  pages.forEach(p=>{
    const d=document.createElement('div');
    d.className='sid-item';d.dataset.page=p.id;
    d.innerHTML=`<span class="sid-icon">${p.icon}</span>${p.label}${p.badge?`<span class="sid-badge" id="sb_${p.id}" style="display:none"></span>`:''}`;
    d.onclick=()=>navigate(p.id);

  // ── mobile drawer nav
  const dn=document.getElementById('drawerNav');
  dn.innerHTML='<div class="sid-label">Menú</div>';
  pages.forEach(p=>{
    const d=document.createElement('div');

    d.onclick=()=>{navigate(p.id);toggleDrawer(false)};

  // ── mobile bottom nav

  bn.innerHTML='';
  bnavPages.forEach(p=>{
    const b=document.createElement('button');
    b.className='bnav-item';b.dataset.bpage=p.id;
    b.innerHTML=`<span class="bnav-icon">${p.icon}</span><span>${p.label}</span>${p.badge?`<span class="bnav-dot" id="bd_${p.badge}" style="display:none"></span>`:''}`;

}

function toggleDrawer(forceOpen){
  const drawer=document.getElementById('mobileDrawer');
  const overlay=document.getElementById('drawerOverlay');
  const isOpen=drawer.classList.contains('open');
  const open=forceOpen!==undefined?forceOpen:!isOpen;
  drawer.classList.toggle('open',open);
  overlay.classList.toggle('open',open);
  document.body.style.overflow=open?'hidden':'';
}

function navigate(page){
  const mc=document.getElementById('mainContent');
  mc.innerHTML='';
  const sec=document.createElement('div');
  sec.className='page-sec active';
  mc.appendChild(sec);
  window.scrollTo({top:0,behavior:'smooth'});

  // mark active: all nav types
  document.querySelectorAll('.nav-link,.sid-item').forEach(el=>{
    el.classList.toggle('active',el.dataset.page===page);
  });
  document.querySelectorAll('.bnav-item').forEach(el=>{
    el.classList.toggle('active',el.dataset.bpage===page);
  });
  document.querySelectorAll('[data-page]').forEach(el=>{
    if(el.dataset.page==='dr_'+page)el.classList.add('active');
    else if(el.dataset.page&&el.dataset.page.startsWith('dr_'))el.classList.remove('active');
  });

  updateBadges();

  switch(page){
    case'dashboard':renderDashboard(sec);break;
    case'members':renderMembers(sec);break;
    case'alerts':renderAlerts(sec);break;
    case'news':renderNews(sec);break;
    case'suggestions':renderSuggestions(sec);break;
    case'mysuggest':renderMySuggest(sec);break;
    case'plans':renderPlans(sec);break;
    case'settings':renderSettings(sec);break;
    case'myprofile':renderMyProfile(sec);break;
  }
}

function updateBadges(){
  const alerts=DB.members.filter(m=>['expiring','expired'].includes(getStatus(m))).length;
  const pending=DB.suggestions.filter(s=>s.status==='pend').length;
  ['nb_alerts','sb_alerts','dr_alerts'].forEach(id=>{const el=document.getElementById(id);if(el){el.textContent=alerts;el.style.display=alerts?'':'none'}});
  ['nb_suggestions','sb_suggestions','dr_suggestions'].forEach(id=>{const el=document.getElementById(id);if(el){el.textContent=pending;el.style.display=pending?'':'none'}});
  // bottom nav dots
  const bdA=document.getElementById('bd_alerts');if(bdA)bdA.style.display=alerts?'':'none';
}

function setMF(f,btn){
  memberFilter=f;
  document.querySelectorAll('.flt').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');filterMembers();
}
function filterMembers(){
  const q=(document.getElementById('memberSearch')?.value||'').toLowerCase();
  const tb=document.getElementById('membersTb');
  const cards=document.getElementById('memberCards');
  if(!tb)return;
  tb.innerHTML='';
  if(cards)cards.innerHTML='';
  let list=DB.members.filter(m=>{
    const st=getStatus(m);
    const ok=memberFilter==='all'||st===memberFilter;
    const match=(m.name+' '+m.last+' '+m.email).toLowerCase().includes(q);
    return ok&&match;
  });
  document.getElementById('membersEmpty').style.display=list.length?'none':'';
  list.forEach(m=>{
    tb.appendChild(buildRow(m,true));
    if(cards)cards.appendChild(buildCard(m));
  });
}

function buildCard(m){
  const st=getStatus(m),rem=getRemaining(m);
  const total=m.totalDays||PLAN_DAYS[m.plan]||30;
  const pct=Math.min(100,Math.round(rem/total*100));
  const bc=st==='active'?'#10B981':st==='expiring'?'#F59E0B':'#EF4444';
  const color=gc(m.name+m.last);
  const avHtml=m.photo?
    `<div class="avatar" style="width:42px;height:42px;background-image:url(${m.photo});background-size:cover;background-position:center"></div>`:
    `<div class="avatar" style="width:42px;height:42px;background:${color};font-size:15px">${ini(m.name,m.last)}</div>`;
  const div=document.createElement('div');
  div.className='mc';
  div.innerHTML=`
    <div class="mc-top">
      ${avHtml}
      <div class="mc-info">
        <div class="mc-name">${m.name} ${m.last}</div>
        <div class="mc-email">${m.email}</div>
      </div>
      <span class="badge ${SC[st]}">${SL[st]}</span>
    </div>
    <div class="mc-mid">
      <span class="plan-tag">${m.plan}</span>
      <div class="days-bar" style="flex:1;margin-left:8px">
        <div class="days-track"><div class="days-fill" style="width:${pct}%;background:${bc}"></div></div>
        <span class="days-text">${rem}d</span>
      </div>
    </div>
    <div class="mc-bot">
      <button class="btn btn-ghost btn-sm" style="flex:1" onclick="viewProfile(${m.id});event.stopPropagation()">Ver perfil</button>
      <button class="btn btn-success btn-sm" onclick="openRenew(${m.id});event.stopPropagation()">🔄 Renovar</button>
      <button class="btn btn-ghost btn-sm" onclick="openEditMember(${m.id});event.stopPropagation()">✏️</button>
      <button class="btn btn-danger btn-sm" onclick="delMember(${m.id});event.stopPropagation()">🗑️</button>
    </div>`;
  div.onclick=()=>viewProfile(m.id);
  return div;
}

function buildRow(m,full){
  const st=getStatus(m),rem=getRemaining(m);
  const total=m.totalDays||PLAN_DAYS[m.plan]||30;
  const pct=Math.min(100,Math.round(rem/total*100));
  const bc=st==='active'?'#10B981':st==='expiring'?'#F59E0B':'#EF4444';
  const color=gc(m.name+m.last);
  const avHtml=m.photo?
    `<div class="avatar" style="background-image:url(${m.photo});background-size:cover;background-position:center"></div>`:
    `<div class="avatar" style="background:${color}">${ini(m.name,m.last)}</div>`;
  let h=`<td><div class="member-info">${avHtml}<div><div class="member-name">${m.name} ${m.last}</div><div class="member-email">${m.email}</div></div></div></td>`;
  if(full)h+=`<td style="color:var(--muted)">${m.phone}</td>`;
  h+=`<td><span class="plan-tag">${m.plan}</span></td>`;
  h+=`<td><span class="badge ${SC[st]}">${SL[st]}</span></td>`;
  h+=`<td><div class="days-bar"><div class="days-track"><div class="days-fill" style="width:${pct}%;background:${bc}"></div></div><span class="days-text">${rem}d</span></div></td>`;
  if(full)h+=`<td style="color:var(--muted);font-size:12px">${getEndDate(m)}</td>`;
  h+=`<td><div class="row-actions">
    <button class="btn btn-ghost btn-sm" onclick="viewProfile(${m.id});event.stopPropagation()">Ver</button>
    <button class="btn btn-success btn-sm" onclick="openRenew(${m.id});event.stopPropagation()">🔄</button>
    <button class="btn btn-ghost btn-sm" onclick="openEditMember(${m.id});event.stopPropagation()">✏️</button>
    <button class="btn btn-danger btn-sm" onclick="delMember(${m.id});event.stopPropagation()">🗑️</button>
  </div></td>`;
  const tr=document.createElement('tr');
  tr.innerHTML=h;tr.onclick=()=>viewProfile(m.id);
  return tr;
}

function saveMember(){
  const name=document.getElementById('fName').value.trim();
  const last=document.getElementById('fLast').value.trim();
  if(!name||!last){showToast('Nombre y apellido son requeridos','error');return}
  const data={name,last,email:document.getElementById('fEmail').value.trim(),
    phone:document.getElementById('fPhone').value.trim(),
    birth:document.getElementById('fBirth').value,
    plan:document.getElementById('fPlan').value,
    status:document.getElementById('fStatus').value,
    start:document.getElementById('fStart').value,
    notes:document.getElementById('fNotes').value.trim(),
    pass:document.getElementById('fPass').value||'1234',
    photo:editId?DB.members.find(x=>x.id===editId)?.photo||'':''
  };
  if(editId){
    const i=DB.members.findIndex(x=>x.id===editId);
    DB.members[i] = {
    ...DB.members[i],
    ...data
};
    showToast('Miembro actualizado','success');
  } else {
  DB.members.push({
    id: DB.nextId.m++,
    ...data
});

let renewId=null,renewMonths=null;
const MONTH_LABELS=['','Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

function openRenew(id){
  renewId=id;renewMonths=null;
  const grid=document.getElementById('monthsGrid');
  grid.innerHTML='';
  for(let i=1;i<=12;i++){
    const b=document.createElement('button');
    b.className='month-btn';
    b.innerHTML=`<span class="mnum">${i}</span><span class="mlab">${i===1?'mes':'meses'}</span>`;
    b.onclick=()=>selectMonth(i,b);
    grid.appendChild(b);
  }
  document.getElementById('renewSummary').style.display='none';
  document.getElementById('btnConfirmRenew').disabled=true;
  openModal('modalRenew');
}
function selectMonth(n,btn){
  renewMonths=n;
  document.querySelectorAll('.month-btn').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
  const days=n*30;
  const m=DB.members.find(x=>x.id===renewId);
  const endStr=new Date(Date.now()+days*86400000).toLocaleDateString('es-AR');
  const sum=document.getElementById('renewSummary');
  sum.style.display='';
  sum.innerHTML=`✅ <strong>${m.name} ${m.last}</strong> — <strong>${n} ${n===1?'mes':'meses'}</strong> (${days} días) · Vence el <strong>${endStr}</strong>`;
  document.getElementById('btnConfirmRenew').disabled=false;
}
function confirmRenew(){
  if(!renewMonths)return;
  const m=DB.members.find(x=>x.id===renewId);
  m.start=today();
  m.totalDays=renewMonths*30;
  m.status='active';
  saveDB();closeModal('modalRenew');
  navigate(currentUser.role==='admin'?'members':'myprofile');
  showToast(`${m.name} renovado por ${renewMonths} ${renewMonths===1?'mes':'meses'}`,'success');
}

function renderNews(sec){
  const isAdmin=currentUser.role==='admin';
  sec.innerHTML=`<div class="topbar">
    <div><div class="page-title">Noticias</div><div class="page-sub">Novedades del gimnasio</div></div>
    ${isAdmin?`<button class="btn btn-primary" onclick="openModal('modalNews')">+ Nueva publicación</button>`:''}
  </div><div class="news-grid" id="newsGrid"></div>`;
  const grid=document.getElementById('newsGrid');
  if(!DB.news.length){grid.innerHTML=`<div class="empty-state"><div class="empty-icon">📰</div><p>No hay publicaciones todavía.</p></div>`;return}
  [...DB.news].reverse().forEach(n=>grid.appendChild(buildNewsCard(n)));
}

function buildNewsCard(n){
  const catColor=CCAT[n.cat]||'#A78BFA';
  const div=document.createElement('div');div.className='news-card';
  const isAdmin=currentUser.role==='admin';
  const uid=currentUser.role==='member'?currentUser.memberId:'admin';
  let reactHtml='';
  const REACT_KEYS=[['like','❤️'],['strong','💪'],['party','🎉']];
  REACT_KEYS.forEach(([key,emoji])=>{
    const count=n.reactions[key]||0;
    const reacted=n.userReacted[uid]===key;
    reactHtml+=`<button class="react-btn ${reacted?'reacted':''}" onclick="react(${n.id},'${key}')">${emoji} <span class="react-count">${count}</span></button>`;
  });
  div.innerHTML=`
    <div class="news-img">${n.emoji||'📰'}</div>
    <div class="news-body">
      <div class="news-cat" style="color:${catColor}">${n.cat.toUpperCase()}</div>
      <div class="news-title">${n.title}</div>
      <div class="news-text">${n.body}</div>
      <div class="news-meta">
        <span class="news-date">${new Date(n.date+'T12:00:00').toLocaleDateString('es-AR',{day:'numeric',month:'long',year:'numeric'})}</span>
        <div class="reactions">${reactHtml}</div>
      </div>
      ${isAdmin?`<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);display:flex;gap:6px">
        <button class="btn btn-danger btn-sm" onclick="deleteNews(${n.id})">🗑️ Eliminar</button>
      </div>`:''}
    </div>`;
  return div;
}

function react(newsId,key){
  const n=DB.news.find(x=>x.id===newsId);
  if(!n)return;
  const uid=currentUser.role==='member'?currentUser.memberId:'admin';
  const prev=n.userReacted[uid];
  if(prev===key){
    n.reactions[key]=Math.max(0,(n.reactions[key]||0)-1);
    delete n.userReacted[uid];
  } else {
    if(prev){n.reactions[prev]=Math.max(0,(n.reactions[prev]||0)-1)}
    n.reactions[key]=(n.reactions[key]||0)+1;
    n.userReacted[uid]=key;
  }
  saveDB();navigate('news');
}

function publishNews(){
  const title=document.getElementById('nTitle').value.trim();
  const body=document.getElementById('nBody').value.trim();
  if(!title||!body){showToast('Título y contenido requeridos','error');return}
  DB.news.push({id:DB.nextId.n++,cat:document.getElementById('nCat').value,emoji:document.getElementById('nEmoji').value||'📢',title,body,date:today(),reactions:{'like':0,'strong':0,'party':0},userReacted:{}});
  saveDB();closeModal('modalNews');navigate('news');showToast('Publicado','success');
}
function deleteNews(id){
  if(!confirm('¿Eliminar esta publicación?'))return;
  DB.news=DB.news.filter(n=>n.id!==id);
  saveDB();navigate('news');showToast('Eliminado','info');
}

function triggerPhotoUpload(){document.getElementById('photoInput')?.click()}
function handlePhoto(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    // Comprimir la imagen antes de guardar (las fotos de celular pesan mucho)
    const img=new Image();
    img.onload=()=>{
      const MAX=400; // px máximo (más que suficiente para un avatar)
      const scale=Math.min(1,MAX/Math.max(img.width,img.height));
      const canvas=document.createElement('canvas');
      canvas.width=Math.round(img.width*scale);
      canvas.height=Math.round(img.height*scale);
      canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
      const compressed=canvas.toDataURL('image/jpeg',0.75);
      const m=DB.members.find(x=>x.id===currentUser.memberId);
      m.photo=compressed;
      try{
        saveDB();buildNav();navigate('myprofile');showToast('Foto actualizada ✓','success');
      } catch(err){
        showToast('La foto es muy grande, probá con otra','error');
      }
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
  // Resetear el input para que onchange dispare aunque sea la misma foto
  input.value='';
}

function openUserEdit(){
  const m=DB.members.find(x=>x.id===currentUser.memberId);
  document.getElementById('ueName').value=m.name;
  document.getElementById('ueLast').value=m.last;
  document.getElementById('ueEmail').value=m.email;
  document.getElementById('uePhone').value=m.phone||'';
  document.getElementById('ueBirth').value=m.birth||'';
  const age=calcAgeFrom(m.birth);
  document.getElementById('ueAge').value=age!==null?`${age} años`:'—';
  openModal('modalUserEdit');
}
function calcAge(){
  const v=document.getElementById('ueBirth')?.value;
  const a=calcAgeFrom(v);
  const el=document.getElementById('ueAge');
  if(el)el.value=a!==null?`${a} años`:'—';
}
function saveUserProfile(){
  const m=DB.members.find(x=>x.id===currentUser.memberId);
  m.name=document.getElementById('ueName').value.trim()||m.name;
  m.last=document.getElementById('ueLast').value.trim()||m.last;
  m.email=document.getElementById('ueEmail').value.trim()||m.email;
  m.phone=document.getElementById('uePhone').value.trim();
  m.birth=document.getElementById('ueBirth').value;
  saveDB();closeModal('modalUserEdit');buildNav();navigate('myprofile');showToast('Perfil actualizado','success');
}

function openModal(id){document.getElementById(id).classList.add('open')}
function closeModal(id){document.getElementById(id).classList.remove('open')}
document.querySelectorAll('.modal-ov').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('open')}));

function showToast(msg,type='info'){
  const icons={success:'✅',error:'❌',info:'ℹ️',warning:'⚠️'};
  const t=document.createElement('div');
  t.className='toast';
  t.innerHTML=`${icons[type]} ${msg}`;
  document.getElementById('toastWrap').appendChild(t);
  setTimeout(()=>t.remove(),3000);
}
